# ============================================================
# LabOA Nginx 配置 — 前端静态资源 + 后端 API 反向代理 + 负载均衡
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ----- 日志格式 -----
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time" '
                    'upstream=$upstream_addr';

    access_log  /var/log/nginx/access.log  main;

    # ----- 基础优化 -----
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    client_max_body_size  100m;          # 允许最大上传 100MB
    client_body_buffer_size 128k;

    # ----- Gzip 压缩 -----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        font/woff2;

    # ----- 后端服务器池（负载均衡）-----
    # 策略: least_conn（最少连接数），适合长连接场景（RAG SSE 流式）
    upstream backend {
        least_conn;
        # 多实例部署时取消注释新增行
        server lab-oa-app:8080  weight=1 max_fails=3 fail_timeout=30s;
        # server lab-oa-app-2:8080  weight=1 max_fails=3 fail_timeout=30s;
        # server lab-oa-app-3:8080  weight=1 max_fails=3 fail_timeout=30s;
        keepalive 64;                      # 保持长连接池
        keepalive_timeout 60s;
        keepalive_requests 100;
    }

    # ----- HTTP → HTTPS 可选（生产环境启用）-----
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }

    server {
        listen 80;
        server_name _;

        # ----- 安全头 -----
        add_header X-Frame-Options         "SAMEORIGIN"   always;
        add_header X-Content-Type-Options  "nosniff"      always;
        add_header X-XSS-Protection        "1; mode=block" always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

        # ----- 根路径：SPA 入口 -----
        root   /usr/share/nginx/html;
        index  index.html;

        # ===== 1. API 反向代理（优先匹配）=====
        location /api/ {
            proxy_pass http://backend;

            # 代理头
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;

            # 超时（RAG 流式问答可能需要较长时间）
            proxy_connect_timeout    10s;
            proxy_send_timeout       300s;      # 5min for SSE streaming
            proxy_read_timeout       300s;
            proxy_buffering          off;       # 关闭缓冲以支持 SSE 流式
            proxy_cache              off;

            # WebSocket 支持（通知推送）
            proxy_http_version 1.1;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # ===== 2. 静态资源（长期缓存）=====
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ===== 3. SPA fallback — 所有非文件请求回退到 index.html =====
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # ===== 4. 健康检查端点 =====
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ===== 5. 禁止访问隐藏文件 =====
        location ~ /\. {
            deny all;
            access_log off;
        }
    }
}
