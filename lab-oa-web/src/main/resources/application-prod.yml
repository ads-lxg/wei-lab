spring:
  datasource:
    url: jdbc:mysql://mysql:3306/lab_oa?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  data:
    redis:
      host: redis
      port: 6379

minio:
  endpoint: http://minio:9000
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: lab-oa

elasticsearch:
  host: elasticsearch
  port: 9200

logging:
  level:
    com.laboa: info
    org.springframework.web: warn