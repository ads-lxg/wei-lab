spring:
  application:
    name: lab-oa
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/lab_oa?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 200MB

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASS:guest}
    publisher-confirm-type: correlated
    publisher-returns: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

sa-token:
  token-name: Authorization
  timeout: 86400
  active-timeout: 1800
  is-concurrent: true
  is-share: false
  token-style: tik
  is-log: false
  jwt-secret-key: ${JWT_SECRET:lab-oa-secret-key-change-in-production}

jwt:
  secret: ${JWT_SECRET:lab-oa-secret-key-change-in-production}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:lab-oa}

elasticsearch:
  host: ${ES_HOST:localhost}
  port: ${ES_PORT:9200}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

knife4j:
  enable: true
  setting:
    language: zh_cn

server:
  port: ${SERVER_PORT:8080}

# 文件分片上传配置
upload:
  temp-dir: ${UPLOAD_TEMP_DIR:/tmp/lab-oa-uploads}

# DeepSeek LLM 配置
deepseek:
  api-key: ${DEEPSEEK_API_KEY:sk-你的DeepSeek密钥}
  base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
  model: ${DEEPSEEK_MODEL:deepseek-v4-flash}

# 阿里云 Embedding 配置
ali:
  embedding:
    api-key: ${ALI_EMBEDDING_API_KEY:sk-你的阿里云DashScope密钥}
    endpoint: ${ALI_EMBEDDING_ENDPOINT:https://dashscope.aliyuncs.com/api/v1/services/embeddings/text-embedding/text-embedding}
    model: ${ALI_EMBEDDING_MODEL:text-embedding-v4}

# RAG 配置
rag:
  system-prompt: ${RAG_SYSTEM_PROMPT:你是一个实验室OA系统的智能助手。请基于以下参考资料和你的知识，全面、详细地回答用户的问题。参考资料中有相关内容时，请用[编号]标注出处；参考资料没有覆盖的部分，你可以结合自身知识进行补充和扩展。如果参考资料与问题完全无关，请直接根据你的知识回答。保持专业、详细的风格。}
  top-k: ${RAG_TOP_K:5}
  chunk-size: ${RAG_CHUNK_SIZE:500}
  chunk-overlap: ${RAG_CHUNK_OVERLAP:50}